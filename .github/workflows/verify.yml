name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  provider:
    runs-on: ubuntu-latest
    steps:
      # checkout@v7 / setup-bun@v2.2.0: the v4 checkout bundles a Node 20
      # action runtime, which the runner now force-upgrades and warns about.
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun test
      - name: Typecheck
        run: bun run typecheck
      - name: Typed lint
        run: bun run lint
      # `git clone`, not actions/checkout: the parity tool resolves
      # `origin/master` and tag descriptions, and reads pinned blobs with
      # `git show <ref>:<path>`. A detached single-commit checkout has none of
      # those refs.
      - name: Clone pinned zcode-api
        run: git clone https://github.com/TriDefender/zcode-api.git .upstream/zcode-api
      - name: Vendored parity
        env:
          ZCODE_API_REPO: ${{ github.workspace }}/.upstream/zcode-api
        run: bun run parity
      - name: Install OMP CLI
        if: github.event_name == 'push'
        run: bun add --global @oh-my-pi/pi-coding-agent@18.1.10
      - name: Clean-device exact-SHA install
        if: github.event_name == 'push'
        run: bun run install-smoke.ts "github:${{ github.repository }}#${{ github.sha }}"
